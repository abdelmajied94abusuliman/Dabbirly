<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل المستخدم - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="wrapper">
        <div id="sidebar-container"></div>
        <div id="content">
            <div id="header-container"></div>
            <div class="content-body">

                <div class="mb-4">
                    <a href="users.html" class="text-decoration-none text-secondary"><i
                            class="fas fa-arrow-right me-1"></i> العودة للمستخدمين</a>
                </div>

                <div class="row" id="user-not-found" style="display: none;">
                    <div class="col-12 text-center">
                        <h4 class="text-danger">المستخدم غير موجود</h4>
                    </div>
                </div>

                <div id="user-content" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h2 class="fw-bold">ملف المستخدم: <span id="user-name"></span></h2>
                        <div id="user-status-badge"></div>
                    </div>

                    <div class="row g-4">
                        <!-- Profile Card -->
                        <div class="col-md-4">
                            <div class="card border-0 shadow-sm mb-4">
                                <div class="card-body text-center pt-5">
                                    <div class="bg-light rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3"
                                        style="width: 100px; height: 100px;">
                                        <i class="fas fa-user fa-3x text-secondary"></i>
                                    </div>
                                    <h4 class="mb-1" id="profile-name"></h4>
                                    <p class="text-muted" id="profile-email"></p>

                                    <div class="text-start mt-4 border-top pt-3">
                                        <p class="mb-2"><strong>رقم الجوال:</strong> <span dir="ltr"
                                                id="profile-mobile"></span></p>
                                        <p class="mb-2"><strong>تاريخ الانضمام:</strong> <span
                                                id="profile-joined"></span></p>
                                        <p class="mb-2"><strong>إجمالي الطلبات:</strong> <span
                                                id="profile-req-count"></span></p>
                                    </div>

                                    <div class="mt-4" id="action-buttons">
                                        <!-- Actions inserted via JS based on status/perms -->
                                    </div>
                                </div>
                            </div>

                            <!-- Saved Locations -->
                            <div class="card border-0 shadow-sm">
                                <div class="card-header bg-white">
                                    <h5 class="mb-0">المواقع المحفوظة</h5>
                                </div>
                                <div class="card-body p-0">
                                    <ul class="list-group list-group-flush" id="locations-list">
                                        <!-- Populated via JS -->
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <!-- History & Reviews -->
                        <div class="col-md-8">
                            <div class="card border-0 shadow-sm">
                                <div class="card-header bg-white">
                                    <ul class="nav nav-tabs card-header-tabs" id="userTabs" role="tablist">
                                        <li class="nav-item">
                                            <a class="nav-link active" id="requests-tab" data-bs-toggle="tab"
                                                href="#requests" role="tab">سجل الطلبات</a>
                                        </li>
                                        <li class="nav-item">
                                            <a class="nav-link" id="reviews-tab" data-bs-toggle="tab" href="#reviews"
                                                role="tab">التقييمات</a>
                                        </li>
                                    </ul>
                                </div>
                                <div class="card-body">
                                    <div class="tab-content" id="userTabsContent">
                                        <!-- Request History -->
                                        <div class="tab-pane fade show active" id="requests" role="tabpanel">
                                            <div class="table-responsive">
                                                <table class="table table-hover align-middle">
                                                    <thead>
                                                        <tr>
                                                            <th>#</th>
                                                            <th>الخدمة</th>
                                                            <th>الحالة</th>
                                                            <th>التاريخ</th>
                                                            <th>الإجراء</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody id="requests-history-body"></tbody>
                                                </table>
                                            </div>
                                        </div>

                                        <!-- Reviews -->
                                        <div class="tab-pane fade" id="reviews" role="tabpanel">
                                            <div class="alert alert-info">لا توجد تقييمات من هذا المستخدم حتى الآن.
                                            </div>
                                            <!-- Placeholder for reviews logic matching mockApi -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const userId = parseInt(getUrlParam('id'));
            if (!userId) {
                document.getElementById("user-not-found").style.display = "block";
                return;
            }

            const user = mockApi.users.find(u => u.id === userId);
            if (!user) {
                document.getElementById("user-not-found").style.display = "block";
                return;
            }

            document.getElementById("user-content").style.display = "block";

            // Fill basic info
            document.getElementById("user-name").innerText = user.name;
            document.getElementById("profile-name").innerText = user.name;
            document.getElementById("profile-email").innerText = user.email;
            document.getElementById("profile-mobile").innerText = user.mobile;
            document.getElementById("profile-joined").innerText = user.joined;

            const isBlocked = user.status === 'blocked';
            const statusHtml = isBlocked
                ? '<span class="badge bg-danger fs-6">محظور</span>'
                : '<span class="badge bg-success fs-6">نشط</span>';
            document.getElementById("user-status-badge").innerHTML = statusHtml;

            // Fill Locations
            const locList = document.getElementById("locations-list");
            if (user.locations.length === 0) {
                locList.innerHTML = '<li class="list-group-item text-muted text-center py-3">لا توجد مواقع محفوظة</li>';
            } else {
                user.locations.forEach(loc => {
                    locList.innerHTML += `
                        <li class="list-group-item">
                            <i class="fas fa-map-marker-alt text-primary me-2"></i> ${loc.neighborhood}, ${loc.city}
                        </li>
                    `;
                });
            }

            // Fill Requests History
            const userRequests = mockApi.requests.filter(r => r.user_id === userId);
            document.getElementById("profile-req-count").innerText = userRequests.length;

            const reqTable = document.getElementById("requests-history-body");
            if (userRequests.length === 0) {
                reqTable.innerHTML = '<tr><td colspan="5" class="text-center text-muted">لا يوجد سجل طلبات</td></tr>';
            } else {
                userRequests.forEach(req => {
                    const subcat = mockApi.subcategories.find(s => s.id === req.subcategory_id);
                    reqTable.innerHTML += `
                        <tr>
                            <td>${req.id}</td>
                            <td>${subcat ? subcat.name_ar : '-'}</td>
                            <td><span class="badge bg-light text-dark border">${req.status}</span></td>
                            <td>${req.created_at}</td>
                            <td><a href="request-details.html?id=${req.id}" class="btn btn-sm btn-light">عرض</a></td>
                        </tr>
                    `;
                });
            }

            // Render Actions button if perm
            if (hasPermission('manage_users')) {
                const btnText = isBlocked ? 'إلغاء الحظر' : 'حظر حساب المستخدم';
                const btnClass = isBlocked ? 'btn-success' : 'btn-outline-danger';
                document.getElementById("action-buttons").innerHTML = `
                    <button class="btn ${btnClass} w-100" onclick="alert('Action simulated')">${btnText}</button>
                `;
            }
        });
    </script>
</body>

</html>
