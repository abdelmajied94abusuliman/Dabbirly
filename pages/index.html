<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - دبرلي</title>
    <!-- Bootstrap 5 RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css?v=1.1">
</head>

<body>

    <div class="wrapper">
        <!-- Sidebar Container -->
        <div id="sidebar-container"></div>

        <!-- Page Content -->
        <div id="content">
            <!-- Header Container -->
            <div id="header-container"></div>

            <div class="content-body">
                <h2 class="mb-4 fw-bold" data-i18n="dashboard">لوحة القيادة</h2>

                <!-- Stats Row -->
                <div class="row g-4 mb-4">
                    <div class="col-md-3">
                        <div class="card p-3 border-start border-4 border-primary shadow-sm h-100">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-muted small mb-1" data-i18n="total_users">إجمالي المستخدمين</div>
                                    <h3 class="mb-0 fw-bold" id="stat-users">0</h3>
                                </div>
                                <div class="bg-blue-soft rounded p-2">
                                    <i class="fas fa-users text-primary fa-lg"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-3 border-start border-4 border-success shadow-sm h-100">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-muted small mb-1" data-i18n="active_providers">مزودي الخدمة النشطين
                                    </div>
                                    <h3 class="mb-0 fw-bold" id="stat-providers">0</h3>
                                </div>
                                <div class="bg-green-soft rounded p-2">
                                    <i class="fas fa-briefcase text-success fa-lg"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-3 border-start border-4 border-warning shadow-sm h-100">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-muted small mb-1" data-i18n="open_requests">الطلبات المفتوحة</div>
                                    <h3 class="mb-0 fw-bold" id="stat-requests">0</h3>
                                </div>
                                <div class="bg-yellow-soft rounded p-2">
                                    <i class="fas fa-clock text-warning fa-lg"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card p-3 border-start border-4 border-danger shadow-sm h-100">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="text-muted small mb-1" data-i18n="unanswered_requests">طلبات بدون عروض
                                    </div>
                                    <h3 class="mb-0 fw-bold" id="stat-unanswered">0</h3>
                                </div>
                                <div class="bg-red-soft rounded p-2">
                                    <i class="fas fa-exclamation-circle text-danger fa-lg"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Charts Row -->
                <div class="row g-3 mb-4">
                    <!-- 1. Requests Chart -->
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
                                <h6 class="card-title mb-0 fs-6" data-i18n="requests_growth">نمو الطلبات</h6>
                            </div>
                            <div class="card-body p-2 position-relative" style="height: 250px;">
                                <canvas id="requestsChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- 2. Top Providers Chart -->
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-header bg-white py-2">
                                <h6 class="card-title mb-0 fs-6" data-i18n="top_providers">أفضل المزودين</h6>
                            </div>
                            <div class="card-body p-2 position-relative" style="height: 250px;">
                                <canvas id="providersChart"></canvas>
                            </div>
                        </div>
                    </div>

                    <!-- 3. Categories Chart -->
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm border-0">
                            <div class="card-header bg-white py-2">
                                <h6 class="card-title mb-0 fs-6" data-i18n="cats_dist">التصنيفات</h6>
                            </div>
                            <div class="card-body p-2 position-relative" style="height: 250px;">
                                <canvas id="categoriesChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Recent Activity & Best Provider -->
                <div class="row g-3">
                    <!-- Best Provider Card -->
                    <div class="col-md-3">
                        <div class="card h-100 bg-primary text-white border-0 shadow-sm">
                            <div
                                class="card-body d-flex flex-column justify-content-center align-items-center text-center p-3">
                                <i class="fas fa-trophy fa-3x mb-2 text-white-50"></i>
                                <h6 class="mb-1" data-i18n="best_provider">المزود الأفضل</h6>
                                <h5 class="fw-bold">ورشة الأمل</h5>
                                <small class="text-white-50">الأكثر تقييماً</small>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Requests Table -->
                    <div class="col-md-9">
                        <div class="card border-0 shadow-sm h-100">
                            <div class="card-header bg-white py-2 d-flex justify-content-between align-items-center">
                                <h6 class="card-title mb-0" data-i18n="recent_requests">آخر الطلبات</h6>
                                <a href="requests.html" class="btn btn-sm btn-outline-primary py-0"
                                    style="font-size: 0.8rem;" data-i18n="view_all">عرض الكل</a>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0 table-sm">
                                        <thead class="bg-light">
                                            <tr>
                                                <th data-i18n="req_num">رقم الطلب</th>
                                                <th data-i18n="user">المستخدم</th>
                                                <th data-i18n="service">الخدمة</th>
                                                <th data-i18n="status">الحالة</th>
                                                <th data-i18n="date">التاريخ</th>
                                            </tr>
                                        </thead>
                                        <tbody id="recent-requests-table">
                                            <!-- Populated by JS -->
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            // Check auth first
            checkAuth();

            const userSession = JSON.parse(sessionStorage.getItem("db_user"));
            if (!userSession) return console.error("No user session found");
            const baseURL = 'https://dabbirly.com';

            let data = null;

            try {
                const response = await fetch(`${baseURL}/api/dashboard/v1/statistics`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${userSession.token}` // Corrected
                    },
                });

                data = await response.json();

                if (!response.ok) {
                    console.error("Failed to fetch users:", response.status, response.statusText);
                }
            } catch (error) {
                console.error("Error fetching users:", error);
            }

            // Populate Stats
            document.getElementById("stat-users").innerText = data.users_counts ?? 0;
            document.getElementById("stat-providers").innerText = data.verified_providers_counts ?? 0;
            document.getElementById("stat-requests").innerText = data.offered_requests_counts ?? 0;
            document.getElementById("stat-unanswered").innerText = data.pending_requests_counts ?? 0;

            // Populate Recent Requests
            const tableBody = document.getElementById("recent-requests-table");
            let requests = null;

            try {
                const response = await fetch(`${baseURL}/api/dashboard/v1/get-requests?recent=5`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${userSession.token}` // Corrected
                    },
                });

                requests = await response.json();

                if (!response.ok) {
                    console.error("Failed to fetch users:", response.status, response.statusText);
                }
            } catch (error) {
                console.error("Error fetching users:", error);
            }

            requests.forEach(req => {
                let badgeClass = 'bg-secondary';
                if (req.status === 'pending') badgeClass = 'bg-warning text-dark';
                if (req.status === 'offered') badgeClass = 'bg-info text-white';

                const row = `
                    <tr>
                        <td>#${req.id}</td>
                        <td>${req.user.first_name ? req.user.first_name : 'Unknown'} ${req.user.last_name ? req.user.last_name : 'Unknown'}</td>
                        <td>${req.sub_category.name_ar || 'غير معروف'}</td>
                        <td><span class="badge ${badgeClass}">${req.status}</span></td>
                        <td>${req.created_at}</td>
                    </tr>
                `;
                tableBody.innerHTML += row;
            });

            // Initialize Charts

            // Helper to destroy existing chart instance
            function destroyChart(id) {
                const existing = Chart.getChart(id);
                if (existing) existing.destroy();
            }

            // 1. Requests Line Chart
            destroyChart('requestsChart');
            const ctxReq = document.getElementById('requestsChart').getContext('2d');
            new Chart(ctxReq, {
                type: 'line',
                data: {
                    labels: ['يوليو', 'أغسطس', 'سبتمبر', 'أكتوبر', 'نوفمبر', 'ديسمبر'],
                    datasets: [{
                        label: 'عدد الطلبات',
                        data: [12, 19, 3, 5, 2, 30],
                        borderColor: '#0d6efd',
                        backgroundColor: 'rgba(13, 110, 253, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    resizeDelay: 200, // Debounce resize
                    plugins: { legend: { display: false } },
                    animation: {
                        duration: 2000,
                        easing: 'easeOutQuart'
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 }
                        }
                    }
                }
            });

            // 2. Categories Doughnut Chart
            destroyChart('categoriesChart');
            const ctxCat = document.getElementById('categoriesChart').getContext('2d');
            new Chart(ctxCat, {
                type: 'doughnut',
                data: {
                    labels: mockApi.categories.map(c => c.name_ar),
                    datasets: [{
                        data: [10, 5],
                        backgroundColor: ['#0d6efd', '#198754'],
                        hoverOffset: 15
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    resizeDelay: 200, // Debounce resize
                    cutout: '70%',
                    animation: {
                        animateRotate: true,
                        animateScale: false
                    },
                    layout: {
                        padding: 10
                    },
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, padding: 15 } }
                    }
                }
            });

            // 3. Top Providers Bar Chart
            destroyChart('providersChart');
            // Calculate Top Providers
            const provCounts = {};
            mockApi.offer_request_provider.forEach(o => {
                provCounts[o.provider_id] = (provCounts[o.provider_id] || 0) + 1;
            });

            // Sort and take top 5
            const sortedProv = Object.entries(provCounts)
                .sort((a, b) => b[1] - a[1])
                .slice(0, 5);

            const provLabels = sortedProv.map(([pid, _]) => {
                const p = mockApi.providers.find(x => x.id == pid);
                return p ? p.business_name : `Prov #${pid}`;
            });
            const provData = sortedProv.map(([_, count]) => count);

            const ctxProv = document.getElementById('providersChart').getContext('2d');
            new Chart(ctxProv, {
                type: 'bar',
                data: {
                    labels: provLabels,
                    datasets: [{
                        label: 'عدد العروض المقدمة',
                        data: provData,
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.7)',
                            'rgba(54, 162, 235, 0.7)',
                            'rgba(255, 206, 86, 0.7)',
                            'rgba(75, 192, 192, 0.7)',
                            'rgba(153, 102, 255, 0.7)'
                        ],
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    resizeDelay: 200, // Debounce resize
                    animation: { duration: 1500 },
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { precision: 0 }
                        },
                        x: {
                            ticks: {
                                autoSkip: false,
                                maxRotation: 45,
                                minRotation: 45
                            }
                        }
                    }
                }
            });
        });
    </script>
</body>

</html>
