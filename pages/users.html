<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدمين - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="wrapper">
        <div id="sidebar-container"></div>
        <div id="content">
            <div id="header-container"></div>
            <div class="content-body">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold" data-i18n="users_title">المستخدمين</h2>
                    <div class="btn-group">
                        <button class="btn btn-outline-secondary btn-sm"><i class="fas fa-filter me-1"></i>
                            <span data-i18n="filter">تصفية</span></button>
                        <button class="btn btn-primary btn-sm"><i class="fas fa-file-export me-1"></i> <span
                                data-i18n="export">تصدير</span></button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th data-i18n="th_id">ID</th>
                                        <th data-i18n="th_user">المستخدم</th>
                                        <th data-i18n="th_contact">معلومات الاتصال</th>
                                        <th data-i18n="th_locations">المواقع</th>
                                        <th data-i18n="th_verification">التوثيق</th>
                                        <th data-i18n="th_join_date">تاريخ الانضمام</th>
                                        <th data-i18n="actions">خيارات</th>
                                    </tr>
                                </thead>
                                <tbody id="users-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const tbody = document.getElementById("users-body");
            const baseURL = 'https://dabbirly.com';

            const userSession = JSON.parse(sessionStorage.getItem("db_user"));
            if (!userSession) return console.error("No user session found");

            try {
                const response = await fetch(`${baseURL}/api/dashboard/v1/get-users?next_cursor=`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${userSession.token}` // Corrected
                    },
                });

                const data = await response.json(); // Parse JSON

                if (!response.ok) {
                    console.error("Failed to fetch users:", response.status, response.statusText);
                    return;
                }

                const users = data.users || []; // Adjust if your API wraps users differently

                tbody.innerHTML = ""; // Clear table before adding new rows
                users.forEach(u => {
                    const verifiedBadge = u.mobile_verified_at
                        ? '<span class="badge bg-success-subtle text-success border border-success-subtle"><i class="fas fa-check-circle"></i> موثق</span>'
                        : '<span class="badge bg-secondary-subtle text-secondary">غير موثق</span>';

                    let statusBadge = `<span class="badge bg-status-active">${u.created_at}</span>`;

                    tbody.innerHTML += `
                <tr>
                    <td><span class="text-muted">#${u.id}</span></td>
                    <td>
                        <div class="d-flex align-items-center gap-2">
                            <div class="bg-light rounded-circle d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                                <i class="fas fa-user text-secondary"></i>
                            </div>
                            <span class="fw-bold text-dark">${u.first_name}</span>
                            <span class="fw-bold text-dark">${u.last_name}</span>
                        </div>
                    </td>
                    <td>
                        <div class="small text-dark">${u.mobile}</div>
                        <div class="small text-muted">${u.email}</div>
                    </td>
                    <td>
                        <span class="badge bg-light text-dark border">${u.locations.length} مواقع</span>
                    </td>
                    <td>${verifiedBadge}</td>
                    <td>${statusBadge}</td>
                    <td>
                        <div class="dropdown">
                            <button class="btn btn-sm btn-light border-0" data-bs-toggle="dropdown"><i class="fas fa-ellipsis-v"></i></button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="user-details.html?id=${u.id}">التفاصيل</a></li>
                                <li><a class="dropdown-item text-danger" href="#">حظر</a></li>
                            </ul>
                        </div>
                    </td>
                </tr>
            `;
                });

            } catch (error) {
                console.error("Error fetching users:", error);
            }
        });
    </script>
</body>

</html>
