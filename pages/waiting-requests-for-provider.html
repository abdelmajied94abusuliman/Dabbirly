<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الطلبات الملغاة - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="wrapper">
        <div id="sidebar-container"></div>
        <div id="content">
            <div id="header-container"></div>
            <div class="content-body">
                <h2 class="fw-bold mb-4" data-i18n="waiting_title">الطلبات المعلقة من المزودين</h2>
                <div class="card border-0 shadow-sm">
                    <div class="card-body">
                        <table class="table table-hover align-middle">
                            <thead class="bg-light">
                                <tr>
                                    <th data-i18n="req_num">رقم الطلب</th>
                                    <th data-i18n="provider">مزود الخدمة</th>
                                    <th data-i18n="provider_mobile">رقم هاتف مزود الخدمة</th>
                                    <th data-i18n="created_at">تاريخ الطلب</th>
                                </tr>
                            </thead>
                            <tbody id="waiting-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderWaitingRequests();
        });

        async function renderWaitingRequests() {
            const tbody = document.getElementById("waiting-body");
            tbody.innerHTML = "";

            const baseURL = 'https://dabbirly.com';

            const userSession = JSON.parse(sessionStorage.getItem("db_user"));
            if (!userSession) {
                console.error("No user session found");
                return;
            }

            let data = null;

            try {
                const response = await fetch(
                    `${baseURL}/api/dashboard/v1/get-waiting-requests`,
                    {
                        method: 'GET',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json',
                            'Authorization': `Bearer ${userSession.token}`
                        },
                    }
                );

                data = await response.json();

                if (!response.ok) {
                    console.error("Failed to fetch waiting requests", data);
                    return;
                }

            } catch (error) {
                console.error("Request error:", error);
                return;
            }

            data.forEach(r => {
                tbody.innerHTML += `
                <tr>
                    <td class="fw-bold text-primary">#${r.id}</td>
                    <td>${r.first_name + ' ' + r.last_name}</td>
                    <td>${r.mobile}</td>
                    <td class="small text-muted">
                        ${r.created_at}
                    </td>
                </tr>
            `;
            });

            // Re-apply translations for dynamic content
            applyLang();
        }
    </script>
</body>

</html>
