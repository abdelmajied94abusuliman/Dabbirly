<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الطلبات - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="wrapper">
        <div id="sidebar-container"></div>
        <div id="content">
            <div id="header-container"></div>
            <div class="content-body">

                <h2 class="fw-bold mb-4">طلبات الخدمة</h2>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold" data-i18n="requests">الطلبات</h2>
                    <div class="btn-group">
                        <button class="btn btn-outline-secondary btn-sm"><i class="fas fa-filter me-1"></i>
                            <span data-i18n="filter">تصفية</span></button>
                        <button class="btn btn-primary btn-sm"><i class="fas fa-file-export me-1"></i> <span
                                data-i18n="export">تصدير</span></button>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header bg-white border-bottom py-3">
                        <ul class="nav nav-tabs card-header-tabs" id="reqTabs">
                            <li class="nav-item">
                                <a class="nav-link active" role="button" onclick="setFilter('all')"
                                    data-i18n="all">الكل</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" role="button" onclick="setFilter('pending')"
                                    data-i18n="pending">المعلقة</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" role="button" onclick="setFilter('offered')"
                                    data-i18n="active">الجارية</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" role="button" onclick="setFilter('cancelled')"
                                    data-i18n="cancelled">الملغاة</a>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th data-i18n="req_num">رقم الطلب</th>
                                        <th data-i18n="user">المستخدم</th>
                                        <th data-i18n="service">الخدمة</th>
                                        <th data-i18n="status">الحالة</th>
                                        <th data-i18n="date">التاريخ</th>
                                        <th data-i18n="actions">خيارات</th>
                                    </tr>
                                </thead>
                                <tbody id="req-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        let currentFilter = 'all';

        document.addEventListener("DOMContentLoaded", () => {
            renderList();
        });

        function setFilter(status) {
            currentFilter = status;

            // Update UI
            document.querySelectorAll('#reqTabs .nav-link').forEach(l => l.classList.remove('active'));
            event.target.classList.add('active');

            renderList();
        }

        async function renderList() {
            const tbody = document.getElementById("req-body");
            tbody.innerHTML = "";

            const baseURL = 'https://dabbirly.com';

            const userSession = JSON.parse(sessionStorage.getItem("db_user"));
            if (!userSession) return console.error("No user session found");

            const nexCursor = null;
            let data = null;

            try {
                const response = await fetch(`${baseURL}/api/dashboard/v1/get-requests?next_cursor=${nexCursor}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${userSession.token}` // Corrected
                    },
                });

                data = await response.json(); // Parse JSON

                if (!response.ok) {
                    console.error("Failed to fetch users:", response.status, response.statusText);
                    return;
                }
            } catch (error) {
                console.error("Failed to fetch users:", error);
            }

            data.requests.forEach(r => {
                if (currentFilter !== 'all' && r.status !== currentFilter) return;

                // Status Badge logic
                let badge = `<span class="badge bg-secondary">${r.status}</span>`;
                if (r.status === 'pending') badge = `<span class="badge bg-warning text-dark" data-i18n="pending">معلق</span>`;
                if (r.status === 'offered') badge = `<span class="badge bg-info text-dark" data-i18n="active">جاري</span>`;
                if (r.status === 'completed') badge = `<span class="badge bg-success" data-i18n="approved">مكتمل</span>`;
                if (r.status === 'cancelled') badge = `<span class="badge bg-danger" data-i18n="cancelled">ملغي</span>`;
                if (r.status === 'accepted') badge = `<span class="badge bg-primary">مقبول</span>`;

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold text-primary">#${r.id}</td>
                        <td>${r.user ? r.user.first_name + '' + r.user.last_name : 'Unknown'}</td>
                        <td>${r.sub_category ? r.sub_category.name_ar : '---'}</td>
                        <td>${badge}</td>
                        <td dir="ltr" class="small text-muted">${r.created_at}</td>
                        <td>
                            <a href="request-details.html?id=${r.id}" class="btn btn-sm btn-outline-primary" data-i18n="details">عرض</a>
                        </td>
                    </tr>
                `;
            });
            // Re-apply translation for dynamically added badges
            applyLang();
        }
    </script>
</body>

</html>
