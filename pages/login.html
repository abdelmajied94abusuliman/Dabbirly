<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-bg d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card login-card shadow-lg p-5" style="width: 100%; max-width: 450px; border-radius: 1rem;">
        <div class="text-center mb-5">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3"
                style="width: 64px; height: 64px;">
                <i class="fas fa-cubes fa-2x"></i>
            </div>
            <h2 class="fw-bold text-dark">دبرلي أدمن</h2>
            <p class="text-muted small">لوحة التحكم المركزية</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com"
                    value="admin@dabbirly.com">
                <label for="floatingInput">البريد الإلكتروني</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="floatingPassword" placeholder="Password"
                    value="password">
                <label for="floatingPassword">كلمة المرور</label>
            </div>

            <!-- Role Simulator -->
            <div class="mb-4">
                <label class="form-label small text-muted text-uppercase fw-bold">اختر نوع الحساب (محاكاة)</label>
                <select class="form-select py-2" id="roleSelect">
                    <option value="super_admin">مدير عام (صلاحيات كاملة)</option>
                    <option value="support">دعم فني (عمليات فقط)</option>
                    <option value="content">مدير محتوى (تصنيفات ونماذج)</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3 shadow-sm">
                تسجيل الدخول <i class="fas fa-arrow-left ms-2"></i>
            </button>
        </form>

        <div class="text-center mt-4">
            <small class="text-muted">&copy; 2026 دبرلي. جميع الحقوق محفوظة.</small>
        </div>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        function handleLogin(e) {
            e.preventDefault();
            const role = document.getElementById('roleSelect').value;
            login(role);
        }
    </script>
</body>

</html>
