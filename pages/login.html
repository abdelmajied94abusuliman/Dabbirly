<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-bg d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <div class="card login-card shadow-lg p-5" style="width: 100%; max-width: 450px; border-radius: 1rem;">
        <div class="text-center mb-5">
            <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3"
                style="width: 64px; height: 64px;">
                <i class="fas fa-cubes fa-2x"></i>
            </div>
            <h2 class="fw-bold text-dark">دبرلي أدمن</h2>
            <p class="text-muted small">لوحة التحكم المركزية</p>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="mobile" placeholder="name@example.com" value="0797193116">
                <label for="mobile">رقم الهاتف</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Password" value="password">
                <label for="password">كلمة المرور</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3 shadow-sm">
                تسجيل الدخول <i class="fas fa-arrow-left ms-2"></i>
            </button>
        </form>

        <div class="text-center mt-4">
            <small class="text-muted">&copy; 2026 دبرلي. جميع الحقوق محفوظة.</small>
        </div>
    </div>

    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();

            const baseURL = 'https://dabbirly.com';
            const loginForm = document.getElementById('loginForm');

            const mobile = document.getElementById('mobile').value;
            const password = document.getElementById('password').value;

            const response = await fetch(`${baseURL}/api/dashboard/v1/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ mobile, password })
            });

            const data = await response.json();
            response.ok ? alert('تم تسجيل الدخول بنجاح!') : alert(data.message || 'حدث خطأ أثناء تسجيل الدخول.');

            const userUser = { name: data.admin.first_name + " " + data.admin.last_name, role: data.admin.role, mobile: data.admin.mobile, token: data.token };

            console.log('userUser', userUser);
            sessionStorage.setItem("db_user", JSON.stringify(userUser));
            window.location.href = "index.html";
        }
    </script>
</body>

</html>
