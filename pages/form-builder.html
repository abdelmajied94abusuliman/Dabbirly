<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بناء النماذج - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css?v=1.1">
    <style>
        .builder-canvas {
            min-height: 500px;
            background: #f8fafc;
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
        }

        .field-item {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .field-item:hover,
        .field-item.active {
            border-color: var(--primary);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .field-item.active::before {
            content: "";
            position: absolute;
            right: -2px;
            top: 0;
            bottom: 0;
            width: 4px;
            background: var(--primary);
            border-radius: 0 4px 4px 0;
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div id="sidebar-container"></div>
        <div id="content">
            <div id="header-container"></div>
            <div class="content-body">

                <div class="d-flex justify-content-between mb-4">
                    <h2 class="fw-bold" data-i18n="form_builder_title">بناء النماذج الديناميكية</h2>
                    <a href="forms.html" class="btn btn-outline-secondary"><i class="fas fa-arrow-right me-2"></i>
                        <span data-i18n="back_to_list">العودة للقائمة</span></a>
                </div>

                <div class="row g-4 h-100">
                    <!-- Left: Toolbox -->
                    <div class="col-md-3">
                        <div class="card mb-3">
                            <div class="card-header bg-white fw-bold" data-i18n="field_types">أنواع الحقول</div>
                            <div class="card-body p-2">
                                <div class="d-grid gap-2">
                                    <button onclick="addField('text')" class="btn btn-light border text-start"><i
                                            class="fas fa-font text-muted me-2"></i> <span data-i18n="field_text">نص
                                            قصير</span></button>
                                    <button onclick="addField('textarea')" class="btn btn-light border text-start"><i
                                            class="fas fa-paragraph text-muted me-2"></i> <span
                                            data-i18n="field_textarea">نص طويل</span></button>
                                    <button onclick="addField('number')" class="btn btn-light border text-start"><i
                                            class="fas fa-hashtag text-muted me-2"></i> <span
                                            data-i18n="field_number">رقم</span></button>
                                    <button onclick="addField('select')" class="btn btn-light border text-start"><i
                                            class="fas fa-list-ul text-muted me-2"></i> <span
                                            data-i18n="field_select">قائمة منسدلة</span></button>
                                    <button onclick="addField('radio')" class="btn btn-light border text-start"><i
                                            class="fas fa-dot-circle text-muted me-2"></i> <span
                                            data-i18n="field_radio">خيار متعدد (Radio)</span></button>
                                    <button onclick="addField('checkbox')" class="btn btn-light border text-start"><i
                                            class="fas fa-check-square text-muted me-2"></i> <span
                                            data-i18n="field_checkbox">مربع اختيار (Checkbox)</span></button>
                                    <button onclick="addField('image')" class="btn btn-light border text-start"><i
                                            class="fas fa-camera text-muted me-2"></i> <span data-i18n="field_image">رفع
                                            صورة</span></button>
                                    <button onclick="addField('date')" class="btn btn-light border text-start"><i
                                            class="fas fa-calendar text-muted me-2"></i> <span
                                            data-i18n="field_date">تاريخ</span></button>
                                    <hr class="my-1">
                                    <button onclick="addField('car_selector')"
                                        class="btn btn-light border text-start"><i
                                            class="fas fa-car text-primary me-2"></i> <span data-i18n="field_car">اختر
                                            سيارة</span></button>
                                    <button onclick="addField('location')" class="btn btn-light border text-start"><i
                                            class="fas fa-map-marker-alt text-primary me-2"></i> <span
                                            data-i18n="field_location">موقع جغرافي</span></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Center: Canvas -->
                    <div class="col-md-5">
                        <div class="card h-100">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                                <input type="text" class="form-control form-control-sm border-0 fw-bold fs-5"
                                    id="form-name" value="نموذج جديد">
                                <span class="badge bg-light text-dark border" id="form-id-badge">New</span>
                            </div>
                            <div class="card-body builder-canvas" id="canvas">
                                <!-- JS Injected -->
                                <div class="text-center text-muted mt-5 pt-5" id="empty-state">
                                    <i class="fas fa-layer-group fa-3x mb-3 text-secondary opacity-50"></i>
                                    <p data-i18n="canvas_empty">اختر حقولاً من القائمة لبناء النموذج</p>
                                </div>
                            </div>
                            <div class="card-footer bg-white text-end">
                                <button class="btn btn-success" onclick="saveForm()"><i class="fas fa-save me-2"></i>
                                    <span data-i18n="save_form">حفظ النموذج</span></button>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Properties -->
                    <div class="col-md-4">
                        <div class="card h-100">
                            <div class="card-header bg-white fw-bold" data-i18n="prop_selected_field">خصائص الحقل المحدد
                            </div>
                            <div class="card-body" id="properties-panel">
                                <p class="text-center text-muted mt-5" data-i18n="prop_select_msg">حدد حقلاً لتعديل
                                    خصائصه</p>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        let schema = [];
        let activeIndex = -1;

        document.addEventListener("DOMContentLoaded", () => {
            // Check for edit mode
            const urlParams = new URLSearchParams(window.location.search);
            const id = parseInt(urlParams.get('id'));

            if (id) {
                const form = mockApi.forms.find(f => f.id === id);
                if (form) {
                    document.getElementById('form-name').value = form.name;
                    document.getElementById('form-id-badge').innerText = '#' + form.id;
                    document.getElementById('empty-state').style.display = 'none';
                    schema = JSON.parse(JSON.stringify(form.fields)); // Deep copy
                    renderCanvas();
                }
            }
        });

        function addField(type) {
            document.getElementById('empty-state').style.display = 'none';
            schema.push({
                name: 'field_' + Date.now(),
                type: type,
                label_ar: 'حقل جديد',
                required: false,
                options: [] // for select
            });
            renderCanvas();
            editField(schema.length - 1);
        }

        function renderCanvas() {
            const canvas = document.getElementById('canvas');
            const emptyState = document.getElementById('empty-state');

            // Keep empty state if needed, remove other items
            Array.from(canvas.children).forEach(child => {
                if (child.id !== 'empty-state') child.remove();
            });

            if (schema.length > 0 && emptyState.style.display !== 'none') {
                emptyState.style.display = 'none';
            }

            schema.forEach((field, idx) => {
                const isActive = idx === activeIndex ? 'active' : '';
                let preview = '';

                // Simple Previews
                if (field.type === 'text') preview = '<input type="text" class="form-control form-control-sm" disabled placeholder="Text Input">';
                if (field.type === 'textarea') preview = '<textarea class="form-control form-control-sm" disabled rows="2"></textarea>';
                if (field.type === 'number') preview = '<input type="number" class="form-control form-control-sm" disabled placeholder="0">';
                if (field.type === 'select') preview = '<select class="form-select form-select-sm" disabled><option>خيارات...</option></select>';
                if (field.type === 'radio') preview = '<div class="form-check"><input class="form-check-input" type="radio" disabled> <label class="form-check-label">خيار 1</label></div>';
                if (field.type === 'checkbox') preview = '<div class="form-check"><input class="form-check-input" type="checkbox" disabled> <label class="form-check-label">خيار 1</label></div>';
                if (field.type === 'car_selector') preview = '<div class="border rounded p-2 bg-light text-center small"><i class="fas fa-car"></i> Car Brand/Model Selector Widget</div>';
                if (field.type === 'file' || field.type === 'image') preview = '<div class="border rounded p-2 bg-light text-center small"><i class="fas fa-cloud-upload-alt"></i> Upload Area</div>';
                if (field.type === 'date') preview = '<input type="date" class="form-control form-control-sm" disabled>';

                const html = `
                    <div class="field-item ${isActive}" onclick="editField(${idx})">
                        <div class="d-flex justify-content-between mb-1">
                            <label class="fw-bold small">${field.label_ar} ${field.required ? '<span class="text-danger">*</span>' : ''}</label>
                            <span class="badge bg-light text-muted border">${field.type}</span>
                        </div>
                        ${preview}
                        <div class="small text-muted mt-1" style="font-size: 0.75rem;">Variable: ${field.name}</div>
                    </div>
                `;
                canvas.insertAdjacentHTML('beforeend', html);
            });
        }

        function editField(idx) {
            activeIndex = idx;
            renderCanvas();

            const field = schema[idx];
            const panel = document.getElementById('properties-panel');

            panel.innerHTML = `
                <div class="mb-3">
                    <label class="form-label small text-muted">عنوان الحقل (AR)</label>
                    <input type="text" class="form-control" value="${field.label_ar}" oninput="updateProp(${idx}, 'label_ar', this.value)">
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted">اسم المتغير (DB Key)</label>
                    <input type="text" class="form-control font-monospace" value="${field.name}" oninput="updateProp(${idx}, 'name', this.value)">
                </div>
                <div class="form-check form-switch mb-3">
                    <input class="form-check-input" type="checkbox" ${field.required ? 'checked' : ''} onchange="updateProp(${idx}, 'required', this.checked)">
                    <label class="form-check-label">مطلوب (Mandatory)</label>
                </div>
                
                ${(field.type === 'select' || field.type === 'radio' || field.type === 'checkbox') ? `
                    <div class="mb-3">
                        <label class="form-label small text-muted">الخيارات (فاصلة ,)</label>
                        <textarea class="form-control" onchange="updateOptions(${idx}, this.value)">${field.options ? field.options.join(',') : ''}</textarea>
                    </div>
                ` : ''}

                <hr>
                <button class="btn btn-outline-danger w-100" onclick="removeField(${idx})"><i class="fas fa-trash me-2"></i> حذف الحقل</button>
            `;
        }

        function updateProp(idx, key, val) {
            schema[idx][key] = val;
            if (key === 'label_ar') renderCanvas();
        }

        function updateOptions(idx, val) {
            schema[idx].options = val.split(',').map(s => s.trim());
        }

        function removeField(idx) {
            schema.splice(idx, 1);
            activeIndex = -1;
            renderCanvas();
            document.getElementById('properties-panel').innerHTML = '<p class="text-center text-muted mt-5">حدد حقلاً لتعديل خصائصه</p>';
        }

        function saveForm() {
            const name = document.getElementById('form-name').value;
            console.log("Saving Schema:", JSON.stringify({ name, fields: schema }, null, 2));
            alert("تم حفظ مخطط النموذج! (تم الطباعة في Console)");
        }
    </script>
</body>

</html>
