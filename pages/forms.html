<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة النماذج - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="../css/style.css?v=1.1">
</head>

<body>
    <div class="wrapper">
        <div id="sidebar-container"></div>
        <div id="content">
            <div id="header-container"></div>
            <div class="content-body">
                <div class="d-flex justify-content-between mb-4">
                    <div>
                        <h2 class="fw-bold mb-1" data-i18n="forms_title">إدارة النماذج</h2>
                        <p class="text-muted" data-i18n="forms_desc">تصميم وتعديل نماذج الخدمات للمستخدمين والمزودين</p>
                    </div>
                    <div>
                        <a href="form-builder.html" class="btn btn-primary"><i class="fas fa-plus me-2"></i> <span
                                data-i18n="new_form">نموذج جديد</span></a>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
                        <h6 class="mb-0 fw-bold" data-i18n="all_forms">كل النماذج</h6>
                        <div class="input-group w-25">
                            <span class="input-group-text bg-light border-end-0"><i
                                    class="fas fa-search text-muted"></i></span>
                            <input type="text" class="form-control border-start-0 ps-0" placeholder="بحث..."
                                data-i18n-placeholder="search" onkeyup="filterTable('forms-table', this.value)">
                        </div>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" id="forms-table">
                                <thead class="bg-light">
                                    <tr>
                                        <th>#</th>
                                        <th data-i18n="form_name">اسم النموذج</th>
                                        <th data-i18n="form_type">النوع</th>
                                        <th data-i18n="fields_count">عدد الحقول</th>
                                        <th data-i18n="creation_date">تاريخ الإنشاء</th>
                                        <th class="text-end" data-i18n="th_actions">الإجراءات</th>
                                    </tr>
                                </thead>
                                <tbody id="forms-body">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            renderTable();
        });

        function renderTable() {
            const tbody = document.getElementById('forms-body');
            tbody.innerHTML = '';

            mockApi.forms.forEach(form => {
                const typeLabel = form.type === 'user_request'
                    ? '<span class="badge bg-primary-subtle text-primary">طلب عميل</span>'
                    : '<span class="badge bg-warning-subtle text-warning">عرض مزود</span>';

                tbody.innerHTML += `
                    <tr>
                        <td class="fw-bold text-muted">#${form.id}</td>
                        <td class="fw-bold">${form.name}</td>
                        <td>${typeLabel}</td>
                        <td><span class="badge bg-light text-dark border">${form.fields.length} حقول</span></td>
                        <td class="text-muted small">2026-01-01</td> <!-- Mock Date -->
                        <td class="text-end">
                            <a href="form-details.html?id=${form.id}" class="btn btn-sm btn-outline-secondary" title="عرض التفاصيل"><i class="fas fa-eye"></i></a>
                            <a href="form-builder.html?id=${form.id}" class="btn btn-sm btn-outline-primary" title="تعديل"><i class="fas fa-edit"></i></a>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteForm(${form.id})" title="حذف"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        function deleteForm(id) {
            Swal.fire({
                title: 'هل أنت متأكد؟',
                text: "لن تتمكن من استرجاع هذا النموذج!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'نعم، احذف',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    // In a real app, API call here.
                    // For mock, we filter array (but it won't persist after reload in this static setup).
                    // We'll simulate success.
                    Swal.fire(
                        'تم الحذف!',
                        'تم حذف النموذج بنجاح.',
                        'success'
                    ).then(() => {
                        // Visual remove for demo
                        const row = event.target.closest('tr'); // This might be tricky if event is not passed, better reload or re-render
                        // re-render logic or simple reload
                        location.reload();
                    });
                }
            })
        }
    </script>
</body>

</html>
