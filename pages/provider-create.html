<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة مزود جديد - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="wrapper">
        <div id="sidebar-container"></div>
        <div id="content">
            <div id="header-container"></div>
            <div class="content-body">

                <div class="mb-4">
                    <a href="providers.html" class="text-decoration-none text-secondary">
                        <i class="fas fa-arrow-right me-1"></i> العودة للقائمة
                    </a>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold">تسجيل مزود خدمة جديد (يدوي)</h2>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-4">
                        <form onsubmit="handleCreateProvider(event)">
                            <h5 class="mb-3 text-primary">بيانات الحساب والنشاط</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">الاسم التجاري <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" name="business_name" required
                                        placeholder="مثال: ورشة الفني المحترف">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">رقم السجل التجاري</label>
                                    <input type="text" class="form-control" name="commercial_register"
                                        placeholder="1010xxxxxx">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">رقم الجوال (للدخول)</label>
                                    <input type="tel" class="form-control" name="phone" placeholder="05xxxxxxxx">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">البريد الإلكتروني</label>
                                    <input type="email" class="form-control" name="email"
                                        placeholder="email@example.com">
                                </div>
                            </div>

                            <h5 class="mb-3 text-primary">التصنيف والمستندات</h5>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label">التصنيف الرئيسي <span class="text-danger">*</span></label>
                                    <select class="form-select" id="main_category_id" onchange="loadSubCategories()"
                                        required>
                                        <option value="">اختر التصنيف الرئيسي</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">التصنيف الفرعي <span class="text-danger">*</span></label>
                                    <select class="form-select" id="sub_category_id" onchange="loadFormBySubCategory()"
                                        required disabled>
                                        <option value="">اختر التصنيف الفرعي</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">صورة السجل التجاري</label>
                                    <input type="file" class="form-control" name="commercial_register_image">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">ملاحظات إدارية</label>
                                    <textarea class="form-control" name="admin_notes" rows="2"></textarea>
                                </div>
                            </div>

                            <div id="dynamic-form-fields"></div>

                            <div class="d-flex justify-content-end gap-2">
                                <button type="button" class="btn btn-light border"
                                    onclick="window.history.back()">إلغاء</button>
                                <button type="submit" class="btn btn-primary px-4 fw-bold">تسجيل المزود</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const baseURL = 'https://dabbirly.com';
        let currentFormId = null;
        let categoriesData = [];

        document.addEventListener("DOMContentLoaded", () => {
            loadMainCategories();
        });

        // 1. تحميل التصنيفات الرئيسية مرة واحدة مع بياناتها الفرعية
        async function loadMainCategories() {
            const userSession = JSON.parse(sessionStorage.getItem("db_user"));
            if (!userSession) {
                alert("الرجاء تسجيل الدخول أولاً");
                return;
            }

            try {
                const response = await fetch(`${baseURL}/api/dashboard/v1/categories`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${userSession.token}`
                    },
                });

                if (!response.ok) throw new Error("Failed to fetch categories");

                const result = await response.json();
                // تخزين البيانات كاملة (الرئيسية والفرعية)
                categoriesData = result.data || [];

                const mainCategorySelect = document.getElementById('main_category_id');
                mainCategorySelect.innerHTML = '<option value="">اختر التصنيف الرئيسي</option>';

                categoriesData.forEach(category => {
                    const option = document.createElement('option');
                    option.value = category.id;
                    option.textContent = category.type_ar || category.type;
                    mainCategorySelect.appendChild(option);
                });

            } catch (error) {
                console.error("Error loading categories:", error);
                alert("حدث خطأ أثناء تحميل التصنيفات");
            }
        }

        // 2. تحديث التصنيفات الفرعية محلياً دون طلب API جديد
        function loadSubCategories() {
            const mainCategoryId = document.getElementById('main_category_id').value;
            const subCategorySelect = document.getElementById('sub_category_id');

            // إعادة ضبط القائمة الفرعية والحقول الديناميكية
            subCategorySelect.innerHTML = '<option value="">اختر التصنيف الفرعي</option>';
            subCategorySelect.disabled = true;
            document.getElementById('dynamic-form-fields').innerHTML = '';
            currentFormId = null;

            if (!mainCategoryId) return;

            // البحث عن التصنيف الرئيسي المختار في البيانات المخزنة
            const selectedCategory = categoriesData.find(cat => cat.id == mainCategoryId);

            if (selectedCategory && selectedCategory.sub_categories) {
                selectedCategory.sub_categories.forEach(sub => {
                    const option = document.createElement('option');
                    option.value = sub.id;
                    option.textContent = sub.name_ar || sub.name;
                    // تخزين معرف النموذج من الكائن form المتداخل
                    option.dataset.formId = sub.form ? sub.form.id : '';
                    subCategorySelect.appendChild(option);
                });
                subCategorySelect.disabled = false;
            }
        }

        // 3. تحميل تفاصيل النموذج عند اختيار التصنيف الفرعي
        async function loadFormBySubCategory() {
            const subCategorySelect = document.getElementById('sub_category_id');
            const selectedOption = subCategorySelect.options[subCategorySelect.selectedIndex];

            document.getElementById('dynamic-form-fields').innerHTML = '';

            if (!selectedOption.value || !selectedOption.dataset.formId) {
                if (selectedOption.value) alert("لا يوجد نموذج مرتبط بهذا التصنيف الفرعي");
                return;
            }

            currentFormId = selectedOption.dataset.formId;
            const userSession = JSON.parse(sessionStorage.getItem("db_user"));

            await loadForm(currentFormId, userSession.token);
        }

        async function loadForm(formId, token) {
            try {
                const response = await fetch(`${baseURL}/api/dashboard/v1/form-by-id/${formId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                });

                if (!response.ok) throw new Error("Failed to fetch form");
                const formData = await response.json();

                console.log(formData);
                renderDynamicFormFields(formData);

            } catch (error) {
                console.error("Error loading form:", error);
                alert("حدث خطأ أثناء تحميل حقول النموذج");
            }
        }

        function renderDynamicFormFields(formData) {
            const container = document.getElementById('dynamic-form-fields');
            const fields = formData.fields || formData.form_fields || formData.data?.fields || [];

            if (fields.length === 0) return;

            container.innerHTML = `
                <h5 class="mb-3 text-primary mt-4">معلومات إضافية</h5>
                <div class="row g-3 mb-4">
                    ${fields.map(field => generateFieldHTML(field)).join('')}
                </div>
            `;
        }

        function generateFieldHTML(field) {
            const isRequired = (field.required || field.is_required) ? '<span class="text-danger">*</span>' : '';
            const requiredAttr = (field.required || field.is_required) ? 'required' : '';
            const fieldName = field.name || field.field_name || '';
            const fieldLabel = field.label || field.field_label || field.name || '';
            const fieldType = field.type || field.field_type || 'text';

            // تكرار نفس منطق الـ Switch السابق للحقول...
            switch (fieldType) {
                case 'text':
                case 'email':
                case 'tel':
                case 'number':
                    return `
                        <div class="col-md-6">
                            <label class="form-label">${fieldLabel} ${isRequired}</label>
                            <input type="${fieldType}" name="dynamic_${fieldName}" class="form-control" ${requiredAttr}>
                        </div>`;
                case 'select':
                case 'dropdown':
                    const options = field.options || [];
                    return `
                        <div class="col-md-6">
                            <label class="form-label">${fieldLabel} ${isRequired}</label>
                            <select name="dynamic_${fieldName}" class="form-select" ${requiredAttr}>
                                <option value="">اختر...</option>
                                ${options.map(opt => `<option value="${opt.value || opt}">${opt.label || opt}</option>`).join('')}
                            </select>
                        </div>`;
                default: return '';
            }
        }

        function handleCreateProvider(event) {
            event.preventDefault();
            const formData = new FormData(event.target);
            console.log("Submitting Provider with Form ID:", currentFormId);
            console.log("Data:", Object.fromEntries(formData.entries()));
            alert("تم تجهيز البيانات، راجع الـ Console.");
        }
    </script>
</body>

</html>
