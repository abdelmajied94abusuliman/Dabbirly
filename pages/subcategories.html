<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الخدمات الفرعية - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="wrapper">
        <div id="sidebar-container"></div>
        <div id="content">
            <div id="header-container"></div>
            <div class="content-body">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold" data-i18n="subcategories_title">الخدمات الفرعية</h2>
                    <button class="btn btn-primary"><i class="fas fa-plus me-1"></i> <span data-i18n="new_service">خدمة
                            جديدة</span></button>
                </div>

                <div class="card border-0 shadow-sm">
                    <div class="card-body p-0">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="bg-light">
                                <tr>
                                    <th data-i18n="th_id">ID</th>
                                    <th data-i18n="service_name">الخدمة</th>
                                    <th data-i18n="main_category">التصنيف الرئيسي</th>
                                    <th data-i18n="linked_forms">النماذج المرتبطة</th>
                                    <th data-i18n="acceptance_score">نسبة القبول</th>
                                    <th data-i18n="matching_factors">عوامل المطابقة</th>
                                    <th data-i18n="th_actions">الإجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="subcategories-body"></tbody>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async function () {
            const tbody = document.getElementById("subcategories-body");

            const userSession = JSON.parse(sessionStorage.getItem("db_user"));
            if (!userSession) return console.error("No user session found");
            const baseURL = 'https://dabbirly.com';

            let data = null;

            try {
                const response = await fetch(`${baseURL}/api/dashboard/v1/subcategories`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${userSession.token}` // Corrected
                    },
                });

                data = await response.json();

                if (!response.ok) {
                    console.error("Failed to fetch users:", response.status, response.statusText);
                }
            } catch (error) {
                console.error("Error fetching users:", error);
            }

            tbody.innerHTML = "";

            console.log(data.data);

            data.data.forEach(sub => {

                const factorsHtml = sub.factors
                    .map(f =>
                        `<span class="badge bg-light text-dark border small me-1">
                        ${f.name} (${f.weight}%)
                    </span>`
                    )
                    .join("");

                tbody.innerHTML += `
                <tr>
                    <td>${sub.id}</td>
                    <td class="fw-bold">${sub.name_ar}</td>
                    <td>${sub.category_name}</td>
                    <td>
                        <div class="small">
                            <i class="fas fa-user-tag text-muted"></i>
                            ${sub.form?.name_ar ?? '-'}
                        </div>
                        <div class="small">
                            <i class="fas fa-store text-muted"></i>
                            ${sub.provider_form?.name_ar ?? '-'}
                        </div>
                    </td>
                    <td>
                        <span class="fw-bold text-primary">
                            ${sub.acceptance_score}%
                        </span>
                    </td>
                    <td>${factorsHtml}</td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary">
                            <i class="fas fa-cog"></i>
                        </button>
                    </td>
                </tr>
            `;
            });
        });
    </script>
</body>

</html>
