<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بيانات السيارات - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="wrapper">
        <div id="sidebar-container"></div>
        <div id="content">
            <div id="header-container"></div>
            <div class="content-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold">قاعدة بيانات السيارات</h2>
                    <button class="btn btn-primary"><i class="fas fa-plus"></i> إضافة ماركة</button>
                </div>
                <div class="row g-4" id="brands-grid"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const grid = document.getElementById("brands-grid");
            mockApi.car_brands.forEach(b => {
                grid.innerHTML += `
                    <div class="col-md-3">
                        <div class="card border-0 shadow-sm text-center p-4">
                            <h5 class="fw-bold">${b.name_en}</h5>
                            <div class="text-primary">${b.name_ar}</div>
                            <button class="btn btn-sm btn-link text-muted mt-2">إدارة الموديلات</button>
                        </div>
                    </div>
                 `;
            });
        });
    </script>
</body>

</html>
