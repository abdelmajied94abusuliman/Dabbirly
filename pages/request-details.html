<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الطلب - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="wrapper">
        <div id="sidebar-container"></div>
        <div id="content">
            <div id="header-container"></div>
            <div class="content-body">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold">تفاصيل الطلب <span id="display-id" class="text-primary"></span></h2>
                    <a href="requests.html" class="btn btn-outline-secondary btn-sm">العودة للطلبات</a>
                </div>

                <div class="row g-4">
                    <!-- Right Column: Request Dynamic Data -->
                    <div class="col-lg-8">
                        <div class="card shadow-sm">
                            <div class="card-header bg-white py-3 fw-bold">تفاصيل الخدمة المطلوبة</div>
                            <div class="card-body p-0">
                                <table class="table table-striped mb-0">
                                    <tbody id="dynamic-fields-body">
                                        <!-- Dynamic rows injected here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        <!-- Images Gallery -->
                        <div class="card shadow-sm mt-4">
                            <div class="card-header bg-white py-3 fw-bold">الصور المرفقة</div>
                            <div class="card-body">
                                <div id="image-gallery" class="d-flex flex-wrap gap-2"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Left Column: User, Category & Provider -->
                    <div class="col-lg-4">
                        <div class="card shadow-sm mb-4" id="subcat-info">
                            <div class="card-header bg-white fw-bold">معلومات التصنيف</div>
                            <div class="card-body" id="subcat-info-body">جاري التحميل...</div>
                        </div>

                        <!-- User Card -->
                        <div class="card shadow-sm mb-4" id="user-card">
                            <div class="card-header bg-white fw-bold">معلومات العميل</div>
                            <div class="card-body" id="user-info">جاري التحميل...</div>
                        </div>

                        <!-- Offers (Providers who sent a price) -->
                        <div class="card shadow-sm mb-4 border-success">
                            <div class="card-header bg-success text-white fw-bold">العروض المستلمة</div>
                            <div class="card-body p-0">
                                <ul class="list-group list-group-flush" id="offers-list">
                                    <!-- Offers will be injected here -->
                                </ul>
                            </div>
                        </div>

                        <!-- Notified Providers (Providers who received the request) -->
                        <div class="card shadow-sm mb-4">
                            <div class="card-header bg-white fw-bold">مزودو الخدمة الذين تلقوا الطلب</div>
                            <div class="card-body p-0">
                                <ul class="list-group list-group-flush" id="notified-providers-list">
                                    <!-- Providers will be injected here -->
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const baseURL = 'https://dabbirly.com';
        const userSession = JSON.parse(sessionStorage.getItem("db_user"));

        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const requestId = urlParams.get('id');
            if (!requestId) return;

            document.getElementById('display-id').textContent = `#${requestId}`;
            fetchFullData(requestId);
        });

        async function fetchFullData(id) {
            const headers = {
                'Accept': 'application/json',
                'Authorization': `Bearer ${userSession.token}`
            };

            try {
                const response = await fetch(`${baseURL}/api/dashboard/v1/request/${id}`, { headers });
                const resJson = await response.json();

                const offerRequest = resJson.offer_request;
                const notifiedProviders = resJson.providers; // هذه للمزودين المتوفرين
                const detailData = offerRequest.request_data.data;

                // 1. عرض الحقول الديناميكية
                const fieldsBody = document.getElementById('dynamic-fields-body');
                fieldsBody.innerHTML = "";

                Object.keys(detailData).forEach(key => {
                    if (key === 'images' || key === 'location' || key === 'title') return;
                    const formattedKey = key.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    const row = `<tr>
                <td class="bg-light fw-bold" style="width: 40%">${formattedKey}</td>
                <td>${detailData[key] || '---'}</td>
            </tr>`;
                    fieldsBody.innerHTML += row;
                });

                if (detailData.description) {
                    fieldsBody.insertAdjacentHTML('afterbegin', `<tr><td class="bg-light fw-bold">Description</td><td>${detailData.description}</td></tr>`);
                }
                if (detailData.title) {
                    fieldsBody.insertAdjacentHTML('afterbegin', `<tr><td class="bg-light fw-bold">Title</td><td>${detailData.title}</td></tr>`);
                }

                // 2. عرض الصور
                const gallery = document.getElementById('image-gallery');
                gallery.innerHTML = "";
                if (detailData.images && detailData.images.length > 0) {
                    detailData.images.forEach(img => {
                        gallery.innerHTML += `<img src="${img}" class="rounded border m-1" style="width: 120px; height: 120px; object-fit: cover; cursor: pointer;" onclick="window.open('${img}')">`;
                    });
                } else {
                    gallery.innerHTML = '<p class="text-muted small">لا توجد صور مرفقة</p>';
                }

                // 3. جلب بيانات المستخدم والتصنيف
                fetchExtraDetails(offerRequest.user_id, offerRequest.request_data.sub_category_id, headers);

                // 4. إرسال مصفوفة العروض المستلمة (تعديل المسار والتأكيد عليه)
                renderOffers(offerRequest.providers);

                // 5. عرض المزودين الذين وصلهم الطلب
                renderNotifiedProviders(notifiedProviders);

            } catch (error) {
                console.error("Error loading request details:", error);
            }
        }

        function renderOffers(providers) {
            const list = document.getElementById('offers-list');
            list.innerHTML = "";

            if (!providers || providers.length === 0) {
                list.innerHTML = '<li class="list-group-item text-muted text-center py-3">لا يوجد عروض حالياً</li>';
                return;
            }

            providers.forEach(p => {
                // استخراج السعر والحالة بناءً على الهيكل الجديد الراجع من الـ API
                const price = p.quoted_price;
                const providerId = p.provider_id;

                list.innerHTML += `
        <li class="list-group-item p-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="d-flex align-items-center">
                    <img src="${baseURL}/storage/${p.logo}" class="rounded me-2" style="width: 35px; height: 35px; margin-left:10px; object-fit: cover;">
                    <span class="fw-bold small">${p.business_name}</span>
                </div>
                <span class="badge bg-success">${price} د.أ</span>
            </div>
            <div class="d-flex justify-content-between align-items-center">
                <a href="provider-details.html?id=${providerId}" class="btn btn-sm btn-link p-0 text-decoration-none">الملف الشخصي</a>
            </div>
        </li>`;
            });
        }

        // دالة جلب بيانات العميل والتصنيف
        async function fetchExtraDetails(userId, subCatId, headers) {
            try {
                const [userRes, subCatRes] = await Promise.all([
                    fetch(`${baseURL}/api/dashboard/v1/user/${userId}`, { headers }),
                    fetch(`${baseURL}/api/dashboard/v1/subcategory/${subCatId}`, { headers })
                ]);

                const userData = await userRes.json();
                const subCatData = await subCatRes.json();

                // تحديث واجهة المستخدم
                document.getElementById('user-info').innerHTML = `
            <div class="d-flex align-items-center mb-2">
                <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-2" style="width: 40px; height: 40px; margin-left:10px">
                    ${userData.data.first_name[0]}${userData.data.last_name[0]}
                </div>
                <div>
                    <h6 class="mb-0">${userData.data.first_name} ${userData.data.last_name}</h6>
                    <small class="text-muted">عميل رقم #${userId}</small>
                </div>
            </div>
                <p class="mb-1 small"><i class="fas fa-phone me-2"></i> ${userData.data.mobile}</p>
                <p class="mb-0 small"><i class="fas fa-envelope me-2"></i> ${userData.data.email || 'لا يوجد بريد'}</p>
            `;

                document.getElementById('subcat-info-body').innerHTML = `
                <div class="badge bg-primary-subtle text-primary p-2">
                    <i class="fas fa-tag me-1"></i> ${subCatData.data.name_ar}
                </div>
            `;
            } catch (e) {
                console.error("Error fetching extra details:", e);
            }
        }

        function renderNotifiedProviders(providers) {
            const list = document.getElementById('notified-providers-list');
            list.innerHTML = "";
            if (!providers || providers.length === 0) {
                list.innerHTML = '<li class="list-group-item text-muted text-center py-3">لم يتم العثور على مزودين</li>';
                return;
            }
            providers.forEach(p => {
                list.innerHTML += `
            <li class="list-group-item d-flex justify-content-between align-items-center p-3">
                <div class="d-flex align-items-center">
                    <img src="${baseURL}/storage/${p.logo}" class="rounded me-2" style="width: 40px; height: 40px; margin-left:10px">
                    <span class="fw-bold small">${p.business_name}</span>
                </div>
                <div class="d-flex justify-content-between align-items-center">
                <a href="provider-details.html?id=${p.id}" class="btn btn-sm btn-link p-0 text-decoration-none">الملف الشخصي</a>
            </div>
            </li>`;
            });
        }
    </script>
</body>

</html>
