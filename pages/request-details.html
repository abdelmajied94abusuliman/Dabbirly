<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل الطلب - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="wrapper">
        <div id="sidebar-container"></div>
        <div id="content">
            <div id="header-container"></div>
            <div class="content-body">

                <div class="d-flex justify-content-between mb-4">
                    <a href="requests.html" class="text-decoration-none text-muted"><i
                            class="fas fa-arrow-right me-1"></i> <span data-i18n="all_requests_link">كل
                            الطلبات</span></a>
                    <div>
                        <button class="btn btn-outline-danger btn-sm" onclick="cancelRequest()"><i
                                class="fas fa-times me-1"></i> <span data-i18n="cancel_request">إلغاء
                                الطلب</span></button>
                    </div>
                </div>

                <!-- Timeline -->
                <div class="card mb-4">
                    <div class="card-body">
                        <div class="timeline-steps" id="timeline">
                            <div class="step" id="step-pending">
                                <div class="icon"><i class="fas fa-clock"></i></div>
                                <div class="small fw-bold" data-i18n="req_new">الطلب جديد</div>
                            </div>
                            <div class="step" id="step-offered">
                                <div class="icon"><i class="fas fa-hand-holding-usd"></i></div>
                                <div class="small fw-bold" data-i18n="req_offered">وصول عروض</div>
                            </div>
                            <div class="step" id="step-accepted">
                                <div class="icon"><i class="fas fa-check"></i></div>
                                <div class="small fw-bold" data-i18n="req_accepted">قبول عرض</div>
                            </div>
                            <div class="step" id="step-completed">
                                <div class="icon"><i class="fas fa-flag-checkered"></i></div>
                                <div class="small fw-bold" data-i18n="req_completed">إكمال الخدمة</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <!-- Right: Info -->
                    <div class="col-md-5">
                        <div class="card h-100">
                            <div class="card-header bg-white fw-bold" data-i18n="req_user_data">بيانات الطلب والعميل
                            </div>
                            <div class="card-body">
                                <div class="d-flex align-items-center mb-3">
                                    <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center me-3"
                                        style="width: 48px; height: 48px;">
                                        <i class="fas fa-user"></i>
                                    </div>
                                    <div>
                                        <h5 class="mb-0" id="u-name">...</h5>
                                        <div class="small text-muted" id="u-mobile">...</div>
                                    </div>
                                </div>
                                <hr>
                                <h6 class="text-primary mb-3" data-i18n="service_details">تفاصيل الخدمة</h6>
                                <div id="form-data-grid">
                                    <!-- Key/Value Pairs -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Left: Offers -->
                    <div class="col-md-7">
                        <div class="card h-100">
                            <div class="card-header bg-white d-flex justify-content-between align-items-center">
                                <h6 class="mb-0 fw-bold"><span data-i18n="offers_title">العروض المقدمة</span> (<span
                                        id="offers-count">0</span>)</h6>
                            </div>
                            <div class="card-body p-0">
                                <div class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="bg-light">
                                            <tr>
                                                <th data-i18n="provider">المزود</th>
                                                <th data-i18n="offer_price">السعر</th>
                                                <th data-i18n="offer_notes">ملاحظات</th>
                                                <th data-i18n="offer_action">الإجراء</th>
                                            </tr>
                                        </thead>
                                        <tbody id="offers-body"></tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const rid = parseInt(getUrlParam('id')) || 2004; // Default to 2004 for demo if no ID
            const req = mockApi.requests.find(r => r.id === rid);

            if (!req) {
                Swal.fire('خطأ', 'الطلب غير موجود', 'error').then(() => window.location.href = 'requests.html');
                return;
            }

            // User Info
            const user = mockApi.users.find(u => u.id === req.user_id);
            if (user) {
                document.getElementById("u-name").innerText = user.name;
                document.getElementById("u-mobile").innerText = user.mobile;
            }

            // Form Data
            const grid = document.getElementById("form-data-grid");
            const labels = {
                "car_brand": "ماركة السيارة",
                "car_model": "الموديل",
                "year": "السنة",
                "notes": "ملاحظات",
                "location": "الموقع",
                "car_type": "نوع السيارة",
                "dropoff": "وجهة النقل"
            };

            for (const [key, val] of Object.entries(req.form_data)) {
                let displayKey = labels[key] || key;
                grid.innerHTML += `
                    <div class="d-flex justify-content-between mb-2 pb-1 border-bottom border-light">
                        <span class="text-muted small">${displayKey}</span>
                        <span class="fw-bold text-dark">${val}</span>
                    </div>
                `;
            }

            // Timeline Viz
            updateTimeline(req.status);

            // Offers
            const offers = mockApi.offer_request_provider.filter(o => o.request_id === rid);
            document.getElementById("offers-count").innerText = offers.length;
            const obody = document.getElementById("offers-body");

            if (offers.length === 0) obody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-4">لا توجد عروض بعد</td></tr>';

            offers.forEach(o => {
                const prov = mockApi.providers.find(p => p.id === o.provider_id);
                const isAccepted = o.is_accepted; // bool in strict schema

                obody.innerHTML += `
                    <tr class="${isAccepted ? 'bg-success-subtle' : ''}">
                        <td>${prov.business_name}</td>
                        <td class="fw-bold text-success">${o.price} ر.س</td>
                        <td class="small text-muted">${o.notes}</td>
                        <td>
                            ${isAccepted
                        ? '<span class="badge bg-success"><i class="fas fa-check"></i> تم القبول</span>'
                        : `<button class="btn btn-sm btn-primary" onclick="acceptOffer(${o.id})">قبول</button>`}
                        </td>
                    </tr>
                `;
            });
        });

        function updateTimeline(status) {
            const map = { 'pending': 0, 'offered': 1, 'accepted': 2, 'completed': 3, 'cancelled': -1 };
            const lvl = map[status] || 0;

            if (status === 'cancelled') {
                document.getElementById('timeline').innerHTML = '<div class="alert alert-danger w-100 text-center">هذا الطلب ملغي</div>';
                return;
            }

            document.querySelectorAll('.timeline-steps .step').forEach((el, idx) => {
                el.classList.remove('active', 'completed');
                if (idx < lvl) el.classList.add('completed');
                if (idx === lvl) el.classList.add('active');
            });
        }

        function acceptOffer(oid) {
            Swal.fire({
                title: 'هل أنت متأكد؟',
                text: "سيتم قبول هذا العرض وتعميد مقدم الخدمة!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#198754',
                cancelButtonColor: '#d33',
                confirmButtonText: 'نعم، قبول العرض',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire(
                        'تم القبول!',
                        'تم تعميد مقدم الخدمة بنجاح.',
                        'success'
                    ).then(() => location.reload());
                }
            })
        }

        function cancelRequest() {
            Swal.fire({
                title: 'إلغاء الطلب؟',
                text: "لن تتمكن من التراجع عن هذا الإجراء!",
                icon: 'error',
                showCancelButton: true,
                confirmButtonColor: '#dc3545',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'نعم، إلغاء الطلب',
                cancelButtonText: 'تراجع'
            }).then((result) => {
                if (result.isConfirmed) {
                    Swal.fire(
                        'تم الإلغاء!',
                        'تم تغيير حالة الطلب إلى ملغي.',
                        'success'
                    ).then(() => window.location.href = 'requests.html');
                }
            })
        }

        // Helper for URL Params (if not in main.js)
        function getUrlParam(name) {
            const params = new URLSearchParams(window.location.search);
            return params.get(name);
        }
    </script>
</body>

</html>
