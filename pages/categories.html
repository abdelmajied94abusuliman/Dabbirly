<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة التصنيفات - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="wrapper">
        <div id="sidebar-container"></div>
        <div id="content">
            <div id="header-container"></div>
            <div class="content-body">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold" data-i18n="categories_title">التصنيفات الرئيسية</h2>
                    <button class="btn btn-primary"><i class="fas fa-plus me-1"></i> <span
                            data-i18n="new_category">تصنيف جديد</span></button>
                </div>

                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th>ID</th>
                                        <th data-i18n="th_image">الصورة</th>
                                        <th data-i18n="th_name_ar">الاسم (عربي)</th>
                                        <th data-i18n="th_name_en">الاسم (إنجليزي)</th>
                                        <th data-i18n="th_actions">الإجراءات</th>
                                    </tr>
                                </thead>
                                <tbody id="cat-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        const baseURL = 'https://dabbirly.com';
        const userSession = JSON.parse(sessionStorage.getItem("db_user"));

        document.addEventListener("DOMContentLoaded", () => {
            if (!userSession) return console.error("No user session found");
            fetchCategories();
        });

        async function fetchCategories() {
            const tbody = document.getElementById("cat-body");

            try {
                const response = await fetch(`${baseURL}/api/dashboard/v1/categories`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${userSession.token}`
                    },
                });

                const data = await response.json();

                if (!response.ok) throw new Error("Failed to fetch");

                tbody.innerHTML = "";
                data.data.forEach(cat => {
                    tbody.innerHTML += `
                    <tr>
                        <td>${cat.id}</td>
                        <td>
                            <div class="bg-light rounded d-flex align-items-center justify-content-center border" style="width: 40px; height: 40px;">
                                <img src="${cat.image}" style="width: 100%; height: 100%; object-fit: cover;"/>
                            </div>
                        </td>
                        <td class="fw-bold text-primary">${cat.type_ar}</td>
                        <td class="text-muted">${cat.type}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-secondary"><i class="fas fa-edit"></i></button>
                            <!-- Delete Button -->
                            <button class="btn btn-sm btn-link text-danger" onclick="deleteCategory(${cat.id})">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </td>
                    </tr>
                `;
                });
            } catch (error) {
                console.error("Error:", error);
            }
        }

        async function deleteCategory(id) {
            if (!confirm("هل أنت متأكد من حذف هذا التصنيف؟")) return;

            try {
                const response = await fetch(`${baseURL}/api/dashboard/v1/category/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        'Authorization': `Bearer ${userSession.token}`
                    }
                });

                if (response.ok) {
                    fetchCategories();
                } else {
                    const errorData = await response.json();
                    alert("حدث خطأ أثناء الحذف: " + (errorData.message || "Unknown error"));
                }
            } catch (error) {
                console.error("Delete Error:", error);
                alert("فشل الاتصال بالخادم");
            }
        }
    </script>
</body>

</html>
