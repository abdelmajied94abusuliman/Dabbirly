<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة التصنيفات - دبرلي</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="wrapper">
        <div id="sidebar-container"></div>
        <div id="content">
            <div id="header-container"></div>
            <div class="content-body">

                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="fw-bold" data-i18n="categories_title">التصنيفات الرئيسية</h2>
                    <button class="btn btn-primary"><i class="fas fa-plus me-1"></i> <span
                            data-i18n="new_category">تصنيف جديد</span></button>
                </div>

                <div class="card">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light">
                                    <tr>
                                        <th>ID</th>
                                        <th data-i18n="th_image">الصورة</th>
                                        <th data-i18n="th_name_ar">الاسم (عربي)</th>
                                        <th data-i18n="th_name_en">الاسم (إنجليزي)</th>
                                        <th data-i18n="th_active">الحالة</th>
                                        <th data-i18n="th_actions">الإجراءات</th>
                                    </tr>
                                </thead>
                                <tbody id="cat-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/mock-data.js"></script>
    <script src="../js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const tbody = document.getElementById("cat-body");
            mockApi.categories.forEach(cat => {
                const badge = cat.is_active
                    ? '<span class="badge bg-status-active">نشط</span>'
                    : '<span class="badge bg-status-inactive">غير نشط</span>';

                tbody.innerHTML += `
                    <tr>
                        <td>${cat.id}</td>
                        <td>
                            <div class="bg-light rounded d-flex align-items-center justify-content-center border" style="width: 40px; height: 40px;">
                                <i class="fas fa-image text-muted"></i>
                            </div>
                        </td>
                        <td class="fw-bold text-primary">${cat.name_ar}</td>
                        <td class="text-muted">${cat.name_en}</td>
                        <td>${badge}</td>
                        <td>
                            <button class="btn btn-sm btn-outline-secondary"><i class="fas fa-edit"></i></button>
                            <button class="btn btn-sm btn-link text-danger"><i class="fas fa-trash-alt"></i></button>
                        </td>
                    </tr>
                `;
            });
        });
    </script>
</body>

</html>
